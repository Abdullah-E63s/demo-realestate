      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#9A7B2C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
